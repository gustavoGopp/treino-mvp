name: CI
# Uma execução por mudança: os ramos são conferidos pelo PR, e a main quando o PR entra. Antes, cada commit de um ramo
# com PR aberto rodava duas vezes (push e pull_request).
on:
  push:
    branches: [main]
  pull_request:
# O fluxo só lê o código: nenhuma permissão de escrita no repositório.
permissions:
  contents: read
# Um commit novo no mesmo ramo cancela a execução anterior dele.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cobertura
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: test-results/
          retention-days: 7
