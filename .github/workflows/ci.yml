name: CI
# Uma execução por mudança: os ramos são conferidos pelo PR, e a main quando o PR entra. Antes, cada commit de um ramo
# com PR aberto rodava duas vezes (push e pull_request).
on:
  push:
    branches: [main]
  pull_request:
# O fluxo só lê o código: nenhuma permissão de escrita no repositório.
permissions:
  contents: read
# Um commit novo no mesmo ramo cancela a execução anterior dele.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O mesmo comando que se roda antes de enviar (lint, tipos, unitários com cobertura e telas, nessa ordem): o que
      # passa lá passa aqui. Antes, cada passo era listado aqui e o `npm run check` local não ligava a cobertura, e um
      # teste estourou o limite de tempo só aqui (17/11/2026). tests/repo/verificacao.test.ts confere que fica assim.
      - run: npm run verificar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-e2e
          path: test-results/
          retention-days: 7
