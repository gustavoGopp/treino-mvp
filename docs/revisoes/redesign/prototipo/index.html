<title>Redesign treino-mvp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Protótipo do redesign do treino-mvp: todas as telas, nos temas claro e escuro, com o Boneco do motor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<link rel="stylesheet" href="boneco.css">
<style>
/* Protótipo do redesign (docs/revisoes/redesign/proposta.md). Uma coluna de celular (até 412 px), a ação embaixo,
   o selo de evidência tocável. Tokens: a direção Giz e grafite (a preferida do Gustavo, 06/11) e, para comparar,
   Ameixa e Petróleo.
   As cores do palco do Boneco vêm de boneco.css e não mudam. */
:root{
  --fundo:#F5F3EF; --superficie:#FFFFFF; --superficie-2:#EAE7E2; --linha:#D9D7D3;
  --texto:#171B20; --texto-2:#464B51; --borda:#5F636B;
  --acao:#3F3AA8; --sobre-acao:#FFFFFF; --acao-suave:#E6EAFE; --foco:#3F3AA8;
  --feito:#0F6B3E; --feito-suave:#D9F5E1; --atencao:#7B5612; --atencao-suave:#FCEAD0;
  --alerta:#AF283D; --alerta-suave:#FEE6E6; --descanso:#E3E6FC; --descanso-texto:#171B20;
  --veu:rgba(23,27,32,.48);
  --fonte:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --t-relogio:5.5rem; --t-numero:2.75rem; --t-titulo:1.5rem; --t-pergunta:1.25rem; --t-corpo:1.0625rem; --t-apoio:.9375rem; --t-rotulo:.8125rem;
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px;
  --r1:8px; --r2:16px; --rp:999px;
  --toque:3rem; --toque-m:3.5rem; --toque-g:4rem;
  --dur:200ms;
  --largura:412px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fundo:#151410; --superficie:#211F1C; --superficie-2:#2D2B27; --linha:#3C3A36;
  --texto:#F1EEE9; --texto-2:#BBB8B0; --borda:#9C998F;
  --acao:#A9B3FF; --sobre-acao:#25284A; --acao-suave:#272A4B; --foco:#A9B3FF;
  --feito:#65AE80; --feito-suave:#12301E; --atencao:#C6974A; --atencao-suave:#362508;
  --alerta:#EA8085; --alerta-suave:#3E1E1F; --descanso:#222537; --descanso-texto:#F1EEE9; --veu:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fundo:#151410; --superficie:#211F1C; --superficie-2:#2D2B27; --linha:#3C3A36;
  --texto:#F1EEE9; --texto-2:#BBB8B0; --borda:#9C998F;
  --acao:#A9B3FF; --sobre-acao:#25284A; --acao-suave:#272A4B; --foco:#A9B3FF;
  --feito:#65AE80; --feito-suave:#12301E; --atencao:#C6974A; --atencao-suave:#362508;
  --alerta:#EA8085; --alerta-suave:#3E1E1F; --descanso:#222537; --descanso-texto:#F1EEE9; --veu:rgba(0,0,0,.6);
  color-scheme:dark;
}
/* Direção Ameixa (a recomendada pelo agente 5) */
:root[data-direcao="ameixa"]{--fundo:#F9F2F0; --superficie:#FFFFFF; --superficie-2:#EFE5E4; --linha:#DDD6D4; --acao:#722987; --sobre-acao:#FFFFFF; --acao-suave:#F5E4FB; --foco:#722987; --descanso:#F1E2F5}
@media (prefers-color-scheme: dark){:root[data-direcao="ameixa"]:not([data-theme="light"]){--fundo:#191211; --superficie:#251D1C; --superficie-2:#312928; --linha:#413837; --texto:#F6ECEA; --texto-2:#C0B6B4; --borda:#736A68; --acao:#DFA1F3; --sobre-acao:#392240; --acao-suave:#3A2341; --foco:#DFA1F3; --atencao:#C59749; --alerta:#E98084; --descanso:#2E2132; --descanso-texto:#F6ECEA}}
:root[data-direcao="ameixa"][data-theme="dark"]{--fundo:#191211; --superficie:#251D1C; --superficie-2:#312928; --linha:#413837; --texto:#F6ECEA; --texto-2:#C0B6B4; --borda:#736A68; --acao:#DFA1F3; --sobre-acao:#392240; --acao-suave:#3A2341; --foco:#DFA1F3; --atencao:#C59749; --alerta:#E98084; --descanso:#2E2132; --descanso-texto:#F6ECEA}
/* Direção Petróleo */
:root[data-direcao="petroleo"]{--fundo:#F0F4F7; --superficie:#FFFFFF; --superficie-2:#E3E9EC; --linha:#D4D8DB; --texto:#171B20; --texto-2:#474B52; --borda:#868A92; --acao:#045260; --sobre-acao:#FFFFFF; --acao-suave:#D2F2FA; --foco:#045260; --atencao:#7E5600; --alerta:#AF293D; --descanso:#D2EEF4}
@media (prefers-color-scheme: dark){:root[data-direcao="petroleo"]:not([data-theme="light"]){--fundo:#0E1518; --superficie:#1A2024; --superficie-2:#252D30; --linha:#343C40; --texto:#E7F0F5; --texto-2:#B2BABF; --borda:#656D71; --acao:#60C7DD; --sobre-acao:#00313B; --acao-suave:#03343D; --foco:#60C7DD; --feito:#66AF81; --atencao:#C6984A; --alerta:#EA8185; --descanso:#0F2B31; --descanso-texto:#E7F0F5}}
:root[data-direcao="petroleo"][data-theme="dark"]{--fundo:#0E1518; --superficie:#1A2024; --superficie-2:#252D30; --linha:#343C40; --texto:#E7F0F5; --texto-2:#B2BABF; --borda:#656D71; --acao:#60C7DD; --sobre-acao:#00313B; --acao-suave:#03343D; --foco:#60C7DD; --feito:#66AF81; --atencao:#C6984A; --alerta:#EA8185; --descanso:#0F2B31; --descanso-texto:#E7F0F5}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:var(--t-corpo);line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
/* o foco programático no título só serve para o leitor de tela anunciar a tela nova */
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* Barra do protótipo (fora do app; some nas capturas) */
.proto{background:var(--superficie-2);border-bottom:1px solid var(--linha);padding-block:var(--e2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto-in{max-width:var(--largura);margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center}
.proto label{font-size:var(--t-rotulo);font-weight:700;color:var(--texto-2);display:flex;flex-direction:column;gap:2px;flex:1 1 120px;min-width:0}
.proto select{min-height:var(--toque);border:2px solid var(--borda);border-radius:var(--r1);background:var(--superficie);font-size:1rem;padding:0 var(--e2);width:100%}
html.captura .proto{display:none}

/* A tela do app: uma coluna de celular */
.app{max-width:var(--largura);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--fundo);position:relative}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.miolo{flex:1;display:flex;flex-direction:column;gap:var(--e5);padding-block:var(--e4) var(--e5)}
.pilha{display:flex;flex-direction:column;gap:var(--e3)}
.pilha-2{display:flex;flex-direction:column;gap:var(--e2)}
h1,h2,h3,p{margin:0}
.titulo{font-size:var(--t-titulo);font-weight:800;line-height:1.15;text-wrap:balance}
.pergunta{font-size:var(--t-pergunta);font-weight:700;line-height:1.3;text-wrap:balance}
.apoio{font-size:var(--t-apoio);color:var(--texto-2)}
.rotulo{font-size:var(--t-rotulo);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--texto-2)}
.lede{font-size:var(--t-corpo)}

/* Cabeçalhos: de passo (cadastro), de seção (casa), de tarefa (treino, guia) */
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--fundo);border-bottom:1px solid var(--linha)}
.cab-in{min-height:var(--toque-m);display:flex;align-items:center;gap:var(--e4)}
.cab-in .meio{flex:1;min-width:0;text-align:center;font-size:var(--t-apoio);font-weight:700;color:var(--texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab-in .marca{flex:1;font-weight:800;font-size:var(--t-corpo)}
.volta{min-height:var(--toque);min-width:var(--toque);display:inline-flex;align-items:center;gap:var(--e1);padding:0 var(--e2) 0 0;border:0;background:none;color:var(--acao);font-weight:700;font-size:var(--t-corpo);cursor:pointer;text-decoration:none}
.passo{display:flex;flex-direction:column;gap:6px;padding-bottom:var(--e2)}
.passo .barra{height:6px;border-radius:var(--rp);background:var(--superficie-2);overflow:hidden}
.passo .barra i{display:block;height:100%;background:var(--acao);border-radius:var(--rp)}
.passo span{font-size:var(--t-rotulo);font-weight:700;color:var(--texto-2)}
.senti{min-height:var(--toque-m);padding:0 var(--e4);display:inline-flex;align-items:center;gap:var(--e2);border:2px solid var(--alerta);border-radius:var(--r2);background:var(--superficie);color:var(--alerta);font-weight:800;font-size:var(--t-corpo);cursor:pointer;white-space:nowrap}
.senti svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Base fixa: a ação principal e a barra inferior */
.base{position:sticky;bottom:0;z-index:18;background:var(--fundo);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px)}
.base .acao{padding-block:var(--e3)}
.barra-inf{display:flex;border-top:1px solid var(--linha);background:var(--superficie)}
.barra-inf a{flex:1;min-height:var(--toque-g);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--t-rotulo);font-weight:700;color:var(--texto-2);text-decoration:none}
.barra-inf a[aria-current="page"]{color:var(--acao)}
.barra-inf a[aria-current="page"] svg{stroke-width:2.6}
.barra-inf svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--e2);width:100%;min-height:var(--toque-m);padding:var(--e2) var(--e4);border-radius:var(--r2);border:2px solid var(--acao);background:var(--acao);color:var(--sobre-acao);font-weight:800;font-size:1.125rem;text-align:center;cursor:pointer;text-decoration:none;line-height:1.2;transition:filter var(--dur)}
.btn:active{filter:brightness(.88)}
.btn.g{min-height:var(--toque-g);font-size:1.25rem}
.btn.sec{background:var(--superficie);color:var(--texto);border-color:var(--borda)}
.btn.ter{background:none;border-color:transparent;color:var(--acao);min-height:var(--toque);font-size:var(--t-corpo);font-weight:700}
.btn.perigo{background:var(--alerta);border-color:var(--alerta);color:var(--superficie)}
.btn.auto{width:auto}
.btn:disabled{background:var(--superficie-2);border-color:var(--superficie-2);color:var(--texto-2);cursor:not-allowed}
.btn small{font-weight:700;font-size:var(--t-apoio);opacity:.9}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2)}
.link{color:var(--acao);font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}

/* Superfícies */
.sup{background:var(--superficie);border-radius:var(--r2);padding:var(--e4);display:flex;flex-direction:column;gap:var(--e2)}
.sup.info{background:var(--acao-suave)}
.sup.aviso{background:var(--atencao-suave)}
.sup.alerta{background:var(--alerta-suave)}
.sup.feito{background:var(--feito-suave)}
.sup h2{font-size:var(--t-pergunta);font-weight:800;line-height:1.25}

/* Selo de evidência: uma palavra curta e apagada, tocável, que abre a fonte (retorno do Gustavo, 06/11: muito sutil) */
.selo{position:relative;display:inline;font:inherit;font-size:var(--t-rotulo);font-weight:600;line-height:1.35;padding:0 2px;border:0;background:none;color:var(--texto-2);cursor:pointer;white-space:nowrap;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px;margin-left:2px}

.selo::after{content:"";position:absolute;left:0;right:0;top:-11px;bottom:-11px}
/* Opções em linha (rádio, caixa) */
.opcoes{display:flex;flex-direction:column;gap:var(--e2)}
.opcao{display:flex;align-items:center;gap:var(--e3);min-height:var(--toque-m);padding:var(--e2) var(--e4);background:var(--superficie);border:2px solid var(--borda);border-radius:var(--r2);cursor:pointer;font-weight:700;line-height:1.3}
.opcao input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--acao)}
.opcao:has(input:checked){border-color:var(--acao);background:var(--acao-suave)}
.opcao:has(input:focus-visible){outline:3px solid var(--foco);outline-offset:2px}
.opcao small{display:block;font-weight:400;font-size:var(--t-apoio);color:var(--texto-2)}
.opcao .icone{width:56px;height:42px;flex:none;color:var(--texto)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:var(--e3)}
legend{padding:0;margin-bottom:var(--e1)}

/* Chips (valores) e segmentado */
.chips{display:flex;flex-wrap:wrap;gap:var(--e2)}
.chip{min-height:var(--toque);min-width:var(--toque);padding:0 var(--e4);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--borda);border-radius:var(--rp);background:var(--superficie);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--acao);border-color:var(--acao);color:var(--sobre-acao)}
.chip[aria-pressed="true"]::before,.chip:has(input:checked)::before{content:"✓"}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:focus-visible){outline:3px solid var(--foco);outline-offset:2px}
.chips.cheios .chip{flex:1 1 0}
.seg{display:flex;gap:var(--e1);padding:var(--e1);border-radius:var(--r2);background:var(--superficie-2)}
.seg button{flex:1 1 0;min-height:var(--toque);border:0;border-radius:12px;background:transparent;font-weight:700;font-size:var(--t-apoio);color:var(--texto-2);cursor:pointer;padding:0 var(--e1)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--superficie);color:var(--texto);box-shadow:0 0 0 2px var(--acao)}
.seg.g button{min-height:var(--toque-m);font-size:var(--t-corpo)}

/* Lista de linhas */
.lista{list-style:none;margin:0;padding:0;background:var(--superficie);border-radius:var(--r2);overflow:hidden}
.lista li+li{border-top:1px solid var(--linha)}
.linha{display:flex;align-items:center;gap:var(--e3);min-height:var(--toque-m);padding:var(--e2) var(--e4);width:100%;border:0;background:none;text-align:left;cursor:pointer;color:inherit;text-decoration:none;font-size:var(--t-corpo)}
.linha .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linha .txt b{font-weight:700;line-height:1.25}
.linha .txt span{font-size:var(--t-apoio);color:var(--texto-2)}
.linha .seta{color:var(--texto-2);font-size:1.375rem;flex:none}
.linha.ex{min-height:76px}
.linha .rx{font-size:var(--t-pergunta);font-weight:800;color:var(--texto);font-variant-numeric:tabular-nums}

/* Miniatura e palco do Boneco (moldura nova; o desenho é o do motor) */
.mini{width:64px;aspect-ratio:4/3;flex:none;border-radius:var(--r1);overflow:hidden;background:var(--stage);display:grid;place-items:center}
.mini svg{width:100%;height:100%;display:block}
.mini.texto{background:var(--superficie-2);color:var(--texto-2);font-size:0.8125rem;font-weight:700;text-align:center;line-height:1.15;padding:2px}
.palco{position:relative;background:var(--stage);aspect-ratio:4/3;max-width:100%}
.palco:not(.mini){width:100%}
.palco svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.palco .hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.palco .fase{background:color-mix(in srgb,var(--stage) 88%,transparent);border-radius:10px;padding:4px 10px;font-size:0.875rem;line-height:1.25;max-width:64%;color:var(--st-ink);font-weight:700}
.palco .breath{font-weight:800;letter-spacing:.04em;font-size:0.9375rem;padding:4px 12px;border-radius:999px;background:#1F3CB8;color:#fff}
.palco .breath.hold{background:#3B4250}
.legenda{display:flex;flex-wrap:wrap;gap:var(--e2) var(--e4);font-size:var(--t-apoio);color:var(--texto-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:12px;border-radius:3px;display:inline-block}

/* Treino */
/* "por quê?": a explicação e as regras saem da tela e ficam a um toque (retorno do Gustavo, 06/11) */
.porque{position:relative;font:inherit;font-size:var(--t-apoio);font-weight:700;color:var(--acao);white-space:nowrap;text-underline-offset:3px}
.porque::after{content:"";position:absolute;left:-6px;right:-6px;top:-12px;bottom:-12px}
.dica{display:flex;gap:var(--e2);align-items:baseline;flex-wrap:wrap;font-size:var(--t-apoio);color:var(--texto-2)}
.dica b{color:var(--texto)}
.rir button.meta-rir{position:relative}
.rir button.meta-rir::after{content:"";position:absolute;left:30%;right:30%;bottom:5px;height:3px;border-radius:2px;background:var(--acao)}
.rir button.meta-rir[aria-pressed="true"]::after{background:var(--sobre-acao)}
.rir-legenda{display:flex;align-items:center;gap:6px;font-size:var(--t-rotulo);color:var(--texto-2)}
.rir-legenda i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--acao)}
.mais-op{width:var(--toque);height:var(--toque);flex:none;border-radius:var(--r2);border:1.5px solid var(--borda);background:var(--superficie);font-size:1.5rem;line-height:1;cursor:pointer;color:var(--texto)}
.ex-cab{display:flex;gap:var(--e3);align-items:center}
.ex-cab .mini{width:88px}
.ex-cab h1{font-size:var(--t-pergunta);font-weight:800;line-height:1.2}
.meta{font-size:var(--t-apoio);color:var(--texto-2);font-variant-numeric:tabular-nums}
.serie-tit{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e2)}
.serie-tit b{font-size:var(--t-pergunta);font-weight:800;font-variant-numeric:tabular-nums}
.feitas{display:flex;gap:6px;flex-wrap:wrap}
.feitas span{font-size:var(--t-rotulo);font-weight:700;background:var(--feito-suave);color:var(--texto);border-radius:var(--rp);padding:3px 10px;font-variant-numeric:tabular-nums}
.feitas span::before{content:"✓ ";color:var(--feito)}
.treino-main{flex:1;display:flex;flex-direction:column}
.treino-main>.miolo{flex:1}
.registro{position:sticky;bottom:var(--h-feita,88px);z-index:16;background:var(--superficie);border-top:1px solid var(--linha);border-radius:20px 20px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.08);padding-block:var(--e3) var(--e1);display:flex;flex-direction:column;gap:var(--e3)}
.registro.solto{position:static;border-radius:var(--r2);border-top:0;box-shadow:none;margin-bottom:var(--e3)}
.feita-base{position:sticky;bottom:0;z-index:17;background:var(--superficie);padding-block:var(--e2) calc(var(--e3) + env(safe-area-inset-bottom,0px))}
.registro.solto+.feita-base{border-top:1px solid var(--linha)}
.linha-reg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--e1) var(--e2)}
.linha-reg .rot{font-weight:700;font-size:var(--t-apoio);color:var(--texto-2)}
.stepper{display:flex;align-items:center;gap:var(--e2)}

const CURTA = { coracao: 'Problema no coração ou pressão alta', peito: 'Dor no peito', tontura: 'Perdeu o equilíbrio por tontura, ou desmaiou, no último ano', 'doenca-cronica': 'Outra doença crônica', medicamento: 'Remédio para doença crônica', osteoarticular: 'Problema em osso, articulação, músculo ou tendão', supervisao: 'Médico pediu exercício só com acompanhamento', gravidez: 'Gravidez, ou bebê nos últimos 6 meses', 'doenca-aguda': 'Febre, gripe forte ou se recuperando de doença' };

// "por quê?": a folha mostra o texto de apoio da tela, cada um com o seu selo (a regra e as fontes a mais um toque)
const PORQUE = {};
const porque = (chave, itens) => { PORQUE[chave] = itens; return ` <a href="#porque" class="porque" data-porque="${chave}">por quê?</a>`; };
function folhaPorque(chave) {
  const itens = PORQUE[chave] || [];
  abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">Por quê</h2><button type="button" class="btn ter auto" data-fechar>Fechar</button></div>
    ${itens.map(([texto, id]) => `<p>${texto}${id ? selo(id) : ''}</p>`).join('')}`, { abaixoCab: !!document.querySelector('.senti') });

function folhaSelo(id) {
  const r = D.regras[id];
  const fontes = r.fontes.map((f) => `<li>${esc(D.fontes[f] || f)}</li>`).join('');
  abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">De onde vem isto</h2><button type="button" class="btn ter auto" data-fechar>Fechar</button></div>
    <p><b>${esc(r.regra)}</b></p>
    <div class="sup info"><p><b>${esc(TXT_SELO[r.selo][0].toUpperCase() + TXT_SELO[r.selo].slice(1))}.</b> ${esc(SIGNIFICADO[r.selo])}</p></div>
    ${fontes ? `<div class="pilha-2"><p class="rotulo">Fontes</p><ol class="apoio" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${fontes}</ol></div>` : ''}

// --- folha inferior e diálogo ---
let ultimoFoco = null, retorno = null;
function abrirFolha(html, opcoes = {}) {
  fechar();

  const veu = document.createElement('div');
  veu.className = 'veu' + (opcoes.abaixoCab ? ' abaixo-cab' : '') + (opcoes.dialogo ? ' centro' : '');

    ? `<div class="dialogo" role="alertdialog"${modal} aria-labelledby="folha-t">${html}</div>`

  veu.addEventListener('click', (e) => { if (e.target === veu || e.target.closest('[data-fechar]')) fechar(); });

  for (const el of [$('#proto'), ...$('#app').children]) if (el && !(opcoes.abaixoCab && el.matches('.cab'))) el.inert = true;

function fechar() {
  if (!document.querySelector('.veu')) return;
  document.querySelectorAll('.veu').forEach((v) => v.remove());
  for (const el of [$('#proto'), ...$('#app').children]) if (el) el.inert = false;

  if (volta) volta.focus();
  ultimoFoco = null; retorno = null;
}

  if (e.key === 'Escape') return fechar();

  if (e.key !== 'Tab' || !veu) return;
  const sel = 'a[href], button:not([disabled]), input:not([disabled]), select, [tabindex="0"]';

// --- peças comuns ---
const ICONE = {

  </div>
</main>`, () => animarBoneco());
function animarBoneco() {
  cancelAnimationFrame(S.raf);
  const svg = $('#svg-boneco'); if (!svg) return;
  const seq = B.guia[S.modo];
  let t = 0, ultimo = performance.now();
  const desenhar = (agora) => {
    const dt = Math.max(0, Math.min(0.05, (agora - ultimo) / 1000)); ultimo = agora;
    if (S.tocando) t += dt * (S.lento ? 0.35 : 1);
    const n = seq.quadros.length;
    const q = seq.quadros[((Math.floor(((t % seq.T) / seq.T) * n) % n) + n) % n];
    if (svg.dataset.q !== q.h.length + q.f) {
      svg.setAttribute('viewBox', q.v); svg.setAttribute('class', q.c); svg.innerHTML = q.h; svg.dataset.q = q.h.length + q.f;
      $('#fase').textContent = S.modo === 'err' ? '❌ ' + GUIA.erros[0].titulo : q.f;
      const r = $('#resp'); r.textContent = q.r; r.className = 'breath' + (q.r === 'FIRME' ? ' hold' : ''); r.hidden = !q.r;
    }
    S.raf = requestAnimationFrame(desenhar);
  };
  S.raf = requestAnimationFrame(desenhar);
}

// ======================= roteador e interações =======================
function iniciarDescanso() {
  clearInterval(S.timer);
  S.descanso = 105;
  S.timer = setInterval(() => {
    const r = $('#relogio'); if (!r) { clearInterval(S.timer); return; }
    S.descanso = Math.max(0, S.descanso - 1);
    r.textContent = tempo(S.descanso);
    const b = $('#tbarra'); if (b) b.style.width = ((105 - S.descanso) / 105) * 100 + '%';
    if (S.descanso === 10) { const st = $('#status-descanso'); if (st) st.textContent = 'Faltam 10 segundos.'; }
    if (!S.descanso) { clearInterval(S.timer); location.hash = 'treino-acabou'; }
  }, 1000);
}
function mostrar() {
  fechar(); cancelAnimationFrame(S.raf); clearInterval(S.timer);
  const id = (location.hash || '').slice(1);
  const t = TELAS[id] || TELAS.indice;
  if (t.id === 'treino') { S.rir = null; S.carga = 8; S.reps = 10; }
  $('#app').innerHTML = t.render();
  $('#sel-tela').value = t.id;
  document.title = `${t.nome.replace(/^[0-9a-z]+\. /, '')} · Redesign treino-mvp`;
  window.scrollTo(0, 0);
  const h = $('#t1'); if (h) h.focus({ preventScroll: true });
  ajustarBarras();
  if (t.depois) t.depois();
}
$('#app').addEventListener('click', (e) => {
  const el = e.target.closest('button, a'); if (!el) return;
  if (el.dataset.selo) { e.preventDefault(); return folhaSelo(el.dataset.selo); }
  if (el.dataset.porque) { e.preventDefault(); return folhaPorque(el.dataset.porque); }
  if (el.dataset.privacidade !== undefined) e.preventDefault();
  if (el.dataset.confirmarTriagem !== undefined) {
    const nao = D.triagem.filter((p) => !$('#tr-' + p.id).checked);
    if (nao.length === D.triagem.length) return aviso('Nenhuma marcada. Se nenhuma vale, volte e toque em "Não, nenhuma".');
    return abrirFolha(`<h2 id="folha-t" class="pergunta" tabindex="-1">Nenhuma destas vale para você?</h2><p>Você não marcou ${nao.length === 1 ? 'esta' : `estas ${nao.length}`}:</p><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto">${nao.map((p) => `<li>${esc(p.texto)}</li>`).join('')}</ul><div class="pilha-2"><a class="btn" href="#experiencia">Isso, nenhuma destas</a><button type="button" class="btn sec" data-fechar>Voltar e marcar</button></div>`, { dialogo: true, retorno: '[data-confirmar-triagem]' });
  }
  if (el.dataset.perguntas !== undefined) { e.preventDefault(); return abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">As 9 perguntas completas</h2><button type="button" class="btn ter auto" data-fechar>Fechar</button></div><ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px">${D.triagem.map((p) => `<li>${esc(p.texto)}</li>`).join('')}</ol><p class="apoio">São perguntas próprias do app, no estilo do PAR-Q+; não é o questionário oficial.</p>`); }
  if (el.dataset.cat) { document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', b === el)); $('#grade').innerHTML = grade(el.dataset.cat); const q = $('#procurar'); if (q) q.value = ''; return; }
  if (el.dataset.halteres !== undefined) return abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">Halteres fixos</h2><button type="button" class="btn ter auto" data-fechar>Pronto</button></div>
    <fieldset><legend style="font-weight:700">O mais leve</legend><div class="chips">${[1, 2, 3, 4].map((k) => `<label class="chip"><input type="radio" name="hl" id="hl-${k}"${k === 1 ? ' checked' : ''}>${k} kg</label>`).join('')}</div></fieldset>
    <fieldset><legend style="font-weight:700">O mais pesado</legend><div class="chips">${[10, 12, 16, 20, 24, 30].map((k) => `<label class="chip"><input type="radio" name="hp" id="hp-${k}"${k === 12 ? ' checked' : ''}>${k} kg</label>`).join('')}</div></fieldset>
    <fieldset><legend style="font-weight:700">De quanto em quanto</legend><div class="chips">${[1, 2, 2.5].map((k) => `<label class="chip"><input type="radio" name="hq" id="hq-${k}"${k === 1 ? ' checked' : ''}>${String(k).replace('.', ',')} kg</label>`).join('')}</div></fieldset>`);
  if (el.dataset.ir) { location.hash = el.dataset.ir; return; }
  if (el.dataset.aviso !== undefined) { if (el.dataset.aviso) aviso(el.dataset.aviso); return; }
  if (el.dataset.ex !== undefined) { const d = D.dias.find((x) => $(`[data-dia][aria-selected="true"]`) && D.dias.indexOf(x) === Number($(`[data-dia][aria-selected="true"]`).dataset.dia)) || diaA; return folhaExercicio(d.exercicios[Number(el.dataset.ex)]); }
  if (el.dataset.dia !== undefined) { const d = D.dias[Number(el.dataset.dia)]; el.closest('.pilha').outerHTML = listaDia(d); return; }
  if (el.dataset.rir) { S.rir = el.dataset.rir; document.querySelectorAll('[data-rir]').forEach((b) => b.setAttribute('aria-pressed', b === el)); const f = $('#feita'); if (f) f.disabled = false; return; }
  if (el.dataset.passo) { const [k, d] = el.dataset.passo.split(':'); S[k] = Math.max(0, Number($('#' + k).textContent.replace(/\D+$/, '').trim() || S[k]) + Number(d)); $('#' + k).innerHTML = k === 'carga' ? `${S[k]}<small> kg</small>` : S[k]; return; }
  if (el.dataset.desc) { S.descanso = Math.max(0, S.descanso + Number(el.dataset.desc)); $('#relogio').textContent = tempo(S.descanso); return; }
  if (el.dataset.modo) { S.modo = el.dataset.modo; mostrar(); return; }
  if (el.id === 'tocar') { S.tocando = !S.tocando; el.textContent = S.tocando ? 'Pausar' : 'Tocar'; return; }
  if (el.id === 'lento') { S.lento = !S.lento; el.setAttribute('aria-pressed', S.lento); return; }
  if (el.dataset.alterna !== undefined) { el.parentElement.querySelectorAll('[data-alterna]').forEach((b) => b.setAttribute('aria-pressed', b === el && b.getAttribute('aria-pressed') !== 'true')); return; }
  if (el.dataset.cartao !== undefined) return abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">Como fazer (em texto)</h2><button type="button" class="btn ter auto" data-fechar>Fechar</button></div><p class="apoio">Trabalha: ${esc(cartaoP.alvo)}.</p><ol class="dicas">${cartaoP.dicas.map((c) => `<li>${esc(c)}</li>`).join('')}</ol><div class="pilha-2"><p class="rotulo">Erros comuns</p><ul class="lista">${cartaoP.erros.map((x) => `<li class="linha" style="cursor:default"><span class="txt"><b>${esc(x.titulo)}</b><span>${esc(x.desc)}</span></span></li>`).join('')}</ul></div>`, { abaixoCab: true });
  if (el.dataset.privacidade !== undefined) return abrirFolha(`<div class="folha-cab"><h2 id="folha-t" tabindex="-1">Seus dados ficam no aparelho</h2><button type="button" class="btn ter auto" data-fechar>Fechar</button></div><p>O seu perfil, o programa e os treinos ficam guardados só neste aparelho. A única coisa que sai é a foto do equipamento, se você usar: ela vai, sem a localização, para o reconhecimento e não fica guardada no servidor. Você pode exportar ou apagar tudo quando quiser em “Meus dados”.</p>`);
});
// a região da dor só aparece com "osso, articulação, músculo ou tendão" marcado
$('#app').addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.cond === 'osteoarticular') $('#onde-sec').hidden = !e.target.checked; });
// o painel da série só fica preso embaixo quando cabe (tela baixa, letra grande ou zoom: ele volta à página) e o
// foco do teclado nunca fica atrás das barras fixas (scroll-padding na altura delas)
function ajustarBarras() {
  const raiz = document.documentElement;
  const feita = $('.feita-base'), reg = $('.registro');
  if (feita) raiz.style.setProperty('--h-feita', feita.offsetHeight + 'px');
  if (reg) { reg.classList.remove('solto'); reg.classList.toggle('solto', reg.offsetHeight > innerHeight * 0.55); }
  const cab = $('.cab');
  const baixo = (reg && !reg.classList.contains('solto') ? reg.offsetHeight : 0) + (feita ? feita.offsetHeight : 0) + ($('.base') ? $('.base').offsetHeight : 0);
  raiz.style.scrollPaddingTop = (cab ? cab.offsetHeight + 8 : 0) + 'px';
  raiz.style.scrollPaddingBottom = baixo + 8 + 'px';
}
window.addEventListener('resize', ajustarBarras);
// a busca procura em todas as categorias
$('#app').addEventListener('input', (e) => {
  if (e.target.id !== 'procurar') return;
  const q = e.target.value.trim().toLowerCase();
  const todos = Object.values(ITENS).flat();
  const achados = q ? todos.filter(([n]) => n.toLowerCase().includes(q)) : ITENS[($('[data-cat][aria-pressed="true"]') || {}).dataset?.cat || D.equipamento[0].titulo];
  $('#grade').innerHTML = achados.length ? achados.map(cardItem).join('') : `<p class="apoio" style="grid-column:1/-1">Nada com "${esc(q)}". Confira a escrita ou procure pela categoria.</p>`;
});
document.body.addEventListener('click', (e) => { const s = e.target.closest('.veu [data-selo]'); if (s) { e.preventDefault(); folhaSelo(s.dataset.selo); } const a = e.target.closest('.veu [data-aviso]'); if (a && a.dataset.aviso) aviso(a.dataset.aviso); const i = e.target.closest('.veu [data-ir]'); if (i) location.hash = i.dataset.ir; });
// a barra do protótipo
const sel = $('#sel-tela');
const grupos = [...new Set(Object.values(TELAS).map((t) => t.grupo))];
sel.innerHTML = grupos.map((g) => `<optgroup label="${g}">${Object.values(TELAS).filter((t) => t.grupo === g).map((t) => `<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</optgroup>`).join('');
sel.addEventListener('change', () => (location.hash = sel.value));
const aplicar = (k, v, attr) => { if (v) document.documentElement.setAttribute(attr, v); else document.documentElement.removeAttribute(attr); guardar(k, v); };
const tema = $('#sel-tema'), dir = $('#sel-dir');
tema.value = ler('proto-tema'); dir.value = ler('proto-dir');
aplicar('proto-tema', tema.value, 'data-theme'); aplicar('proto-dir', dir.value, 'data-direcao');
tema.addEventListener('change', () => aplicar('proto-tema', tema.value, 'data-theme'));
dir.addEventListener('change', () => aplicar('proto-dir', dir.value, 'data-direcao'));
if (window.CAPTURA) document.documentElement.classList.add('captura');
window.__TELAS = Object.values(TELAS).map((t) => ({ id: t.id, nome: t.nome, grupo: t.grupo }));
window.addEventListener('hashchange', mostrar);
mostrar();
})();
