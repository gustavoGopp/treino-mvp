<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direção A, Giz</title>
<link rel="stylesheet" href="../comum/boneco.css">
<link rel="stylesheet" href="../comum/base.css">
<style>
/* Direção A, "Giz": a identidade de hoje (fundo de giz, texto de grafite, índigo, Atkinson Hyperlegible Next), sem
   contornos. O que agrupa é a distância e a superfície; o Boneco ocupa o topo do treino, de borda a borda. */
@font-face{font-family:"Atkinson Hyperlegible Next";font-weight:200 800;font-display:swap;src:url("../comum/fontes/atkinson-hyperlegible-next-latin.woff2") format("woff2")}
:root{
  --fonte:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fundo:#F5F3EF; --sup:#FFFFFF; --sup2:#EAE7E2; --texto:#171B20; --texto2:#464B51;
  --acao:#3F3AA8; --sobre-acao:#FFFFFF; --acao-suave:#E6EAFE; --foco:#3F3AA8;
  --alerta:#AF283D; --alerta-suave:#FEE6E6; --feito:#0F6B3E; --descanso:#E3E6FC; --inativo:#8A8D92;
  --r8:8px; --r16:16px; --r24:24px; --rp:999px;
  --t-relogio:6rem; --t-numero:2rem; --t-titulo:2rem; --t-ex:1.25rem; --t-corpo:1.0625rem; --t-apoio:.9375rem; --t-rotulo:.8125rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fundo:#151410; --sup:#211F1C; --sup2:#2D2B27; --texto:#F1EEE9; --texto2:#BBB8B0;
  --acao:#A9B3FF; --sobre-acao:#1B1E3F; --acao-suave:#272A4B; --foco:#A9B3FF;
  --alerta:#EA8085; --alerta-suave:#3E1E1F; --feito:#65AE80; --descanso:#222537; --inativo:#8C897F; color-scheme:dark}}
:root[data-theme="dark"]{
  --fundo:#151410; --sup:#211F1C; --sup2:#2D2B27; --texto:#F1EEE9; --texto2:#BBB8B0;
  --acao:#A9B3FF; --sobre-acao:#1B1E3F; --acao-suave:#272A4B; --foco:#A9B3FF;
  --alerta:#EA8085; --alerta-suave:#3E1E1F; --feito:#65AE80; --descanso:#222537; --inativo:#8C897F; color-scheme:dark}
body{font-size:var(--t-corpo)}
.rotulo{font-size:var(--t-rotulo);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--texto2)}
.apoio{font-size:var(--t-apoio);color:var(--texto2)}
.gutter{padding-left:max(var(--e16),env(safe-area-inset-left,0px));padding-right:max(var(--e16),env(safe-area-inset-right,0px))}

/* botões: uma ação principal por tela, 64 de altura; o resto é discreto */
.btn{min-height:var(--h56);padding:0 var(--e24);border-radius:var(--r16);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:var(--e8);transition:transform .1s ease-out,background-color .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acao);color:var(--sobre-acao);min-height:var(--h64);width:100%;font-size:1.1875rem}
.btn.pri:disabled{background:var(--sup2);color:var(--inativo);transform:none}
.btn.pri .sub{font-weight:400;font-size:var(--t-apoio);opacity:.9}
.btn.quieto{background:var(--sup2);min-height:var(--h48);padding:0 var(--e16);border-radius:var(--r8);font-size:var(--t-apoio)}

/* ---------- início ---------- */
.tela-inicio .miolo{flex:1;display:flex;flex-direction:column;gap:var(--e32);padding-top:var(--e24);padding-bottom:var(--e24)}
.hoje{display:flex;flex-direction:column;gap:var(--e8)}
.hoje h1{font-size:var(--t-titulo);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.outros{display:flex;flex-direction:column;gap:var(--e8)}
.outros h2{padding-bottom:var(--e8)}
.semana{display:flex;align-items:center;gap:var(--e16)}
.semana ol{display:flex;gap:var(--e8)}
.semana li{width:var(--e32);height:var(--e8);border-radius:var(--rp);background:var(--sup2)}
.lista{display:flex;flex-direction:column;gap:var(--e16)}
.lista li{display:flex;align-items:center;gap:var(--e16);min-height:var(--h64)}
.lista .mini{width:5.5rem;aspect-ratio:4/3;border-radius:var(--r8);flex:none}
.lista .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--e4)}
.lista b{font-weight:700;line-height:1.25;text-wrap:balance}
.lista .rx{font-size:var(--t-apoio);color:var(--texto2)}
.lista [data-icone]{color:var(--inativo);--icone:20px}
.sobre{display:flex;align-items:center;justify-content:space-between;gap:var(--e16);min-height:var(--h56);padding:0 var(--e16);background:var(--sup);border-radius:var(--r16);text-align:left;width:100%}
.sobre span:first-child{display:flex;flex-direction:column}
.base{position:sticky;bottom:0;background:var(--fundo);padding-top:var(--e16);display:flex;flex-direction:column;gap:var(--e8);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra{display:flex}
.barra button{flex:1;min-height:var(--h64);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--e4);font-size:var(--t-rotulo);font-weight:700;color:var(--texto2)}
.barra button[aria-current]{color:var(--acao)}

/* ---------- treino ---------- */
.treino-topo{display:flex;align-items:center;gap:var(--e8);min-height:var(--h64);padding-top:var(--e8);padding-bottom:var(--e8)}
.treino-topo .volta{width:var(--h48);height:var(--h48);display:grid;place-items:center;border-radius:var(--r8);margin-left:calc(-1 * var(--e8))}
.treino-topo p{flex:1;font-weight:700;color:var(--texto2)}
.senti{min-height:var(--h48);padding:0 var(--e16);border-radius:var(--r8);background:var(--alerta-suave);color:var(--alerta);font-weight:700;display:inline-flex;align-items:center;gap:var(--e8)}
.senti [data-icone]{--icone:20px}
.palco-bloco .palco{aspect-ratio:3/2;width:100%}
.palco-ctl{display:flex;align-items:center;gap:var(--e8);padding-top:var(--e8);padding-bottom:var(--e8)}
.moldura{position:relative}
.moldura .fase{position:absolute;top:var(--e8);left:max(var(--e16),env(safe-area-inset-left,0px));font-size:var(--t-apoio);font-weight:700;color:var(--texto2)}
.palco-ctl{justify-content:space-between}
.seg{display:flex;background:var(--sup2);border-radius:var(--r16);padding:var(--e4)}
.seg button{min-height:calc(var(--h48) - var(--e8));padding:0 var(--e16);border-radius:calc(var(--r16) - var(--e4));font-size:var(--t-apoio);font-weight:700;color:var(--texto2)}
.seg button[aria-pressed="true"]{background:var(--sup);color:var(--texto)}
.redondo{width:var(--h48);height:var(--h48);border-radius:var(--r16);background:var(--sup2);display:grid;place-items:center}
.redondo [data-icone]{--icone:20px}
.relogio-bloco{background:var(--descanso);padding-top:var(--e24);padding-bottom:var(--e16);display:none;flex-direction:column;align-items:center;gap:var(--e8)}
body[data-fase="descanso"] .relogio-bloco{display:flex}
.relogio{font-size:var(--t-relogio);font-weight:800;line-height:1;letter-spacing:-.02em}
.trilho{width:100%;height:var(--e4);border-radius:var(--rp);background:var(--sup2);overflow:hidden}
.trilho i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:var(--acao);border-radius:var(--rp);transition:width 1s linear}
.tres{display:flex;gap:var(--e8);width:100%;padding-top:var(--e8)}
.tres .btn{flex:1}
.ex{display:flex;align-items:center;gap:var(--e16);padding-top:var(--e16);padding-bottom:var(--e16)}
.ex .mini{width:4rem;aspect-ratio:4/3;border-radius:var(--r8);flex:none;display:none}
body[data-fase="descanso"] .ex .mini{display:grid}
.ex .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--e4)}
.ex h1{font-size:var(--t-ex);font-weight:800;line-height:1.2}
.painel{margin-top:auto;background:var(--sup);border-radius:var(--r24) var(--r24) 0 0;padding-top:var(--e24);padding-bottom:calc(var(--e16) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--e24)}
.painel-cab{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e16)}
.painel h2{font-size:var(--t-corpo);font-weight:800}
.salva{display:none;align-items:center;gap:var(--e8);font-size:var(--t-apoio);color:var(--feito);font-weight:700}
body[data-tem-feita] .salva{display:inline-flex}
.salva button{color:var(--texto);text-decoration:underline;text-underline-offset:3px;min-height:var(--h48);padding:0 var(--e8);margin:calc(-1 * var(--e16)) calc(-1 * var(--e8)) calc(-1 * var(--e16)) 0;font-weight:700}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:var(--e16)}
.passo{display:flex;flex-direction:column;gap:var(--e8)}
.passo-linha{display:flex;align-items:center;background:var(--sup2);border-radius:var(--r16);padding:var(--e8);min-height:var(--h64)}
.passo-linha button{width:var(--h48);height:var(--h48);border-radius:calc(var(--r16) - var(--e8));background:var(--sup);display:grid;place-items:center;flex:none;transition:transform .1s ease-out}
.passo-linha button:active{transform:scale(.94)}
.passo-linha button:disabled{color:var(--inativo);background:transparent}
.passo-linha output{flex:1;text-align:center;font-size:var(--t-numero);font-weight:800;line-height:1;white-space:nowrap}
.passo-linha small{font-size:var(--t-apoio);font-weight:400;color:var(--texto2);margin-left:var(--e4)}
.rir{display:flex;flex-direction:column;gap:var(--e8)}
.rir-cab{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e8);flex-wrap:wrap}
.rir-linha{display:flex;gap:var(--e8)}
.rir-linha button{flex:1;min-height:var(--h48);border-radius:var(--r8);background:var(--sup2);font-weight:700;position:relative;transition:transform .1s ease-out}
.rir-linha button:active{transform:scale(.96)}
.rir-linha button[data-na-meta]::after{content:"";position:absolute;left:var(--e16);right:var(--e16);bottom:var(--e8);height:2px;border-radius:var(--rp);background:currentColor;opacity:.55}
.rir-linha button[aria-pressed="true"]{background:var(--acao);color:var(--sobre-acao)}
.hora{display:none;font-size:var(--t-ex);font-weight:800;color:var(--acao)}
body[data-acabou] .hora{display:block}
@media (max-width:359px){
  .dupla{grid-template-columns:1fr}
  .passo{flex-direction:row;align-items:center;justify-content:space-between}
  .passo-linha{width:11rem}
  .relogio{font-size:5rem}
}
@media (max-height:700px){.palco-bloco .palco{aspect-ratio:2/1}.painel{gap:var(--e16);padding-top:var(--e16)}}
</style>
</head>
<body data-tela="inicio" data-fase="serie">
<nav class="proto" aria-label="Protótipo"><b>A · Giz</b><a href="../index.html">Direções</a><button type="button" data-acao="ir-inicio">Início</button><button type="button" data-acao="ir-treino">Treino</button><button type="button" data-acao="tema" aria-label="Trocar o tema"><i data-icone="sun-moon"></i></button></nav>
<div class="celular">

<!-- ===== INÍCIO ===== -->
<section class="tela tela-inicio" aria-label="Início">
  <main class="miolo gutter">
    <div class="hoje">
      <p class="rotulo">Hoje · semana <span data-t="semana"></span></p>
      <h1 data-t="diaNome"></h1>
      <p class="apoio"><span data-t="nExercicios"></span> exercícios · ~<span data-t="minutos"></span> min</p>
    </div>
    <div class="semana">
      <ol aria-hidden="true"><li></li><li></li><li></li></ol>
      <p class="apoio">0 de <span data-t="diasPorSemana"></span> treinos nesta semana</p>
    </div>
    <ol class="lista" data-lista="exercicios" aria-label="Exercícios de hoje"><template><li><span class="palco mini" data-mini-i></span><span class="txt"><b data-i="nome"></b><span class="rx" data-i="prescricao"></span></span><i data-icone="chevron-right"></i></li></template></ol>
    <div class="outros">
      <h2 class="rotulo">Outros dias</h2>
      <div class="outros" data-lista="outros-dias"><template><button type="button" class="sobre"><span><b data-i="nome"></b><span class="apoio" data-i="resumo"></span></span><i data-icone="chevron-right"></i></button></template></div>
      <button type="button" class="sobre"><span><b>Sobre o programa</b><span class="apoio">1 ponto a ajustar</span></span><i data-icone="chevron-right"></i></button>
    </div>
  </main>
  <footer class="base gutter">
    <button type="button" class="btn pri" data-acao="ir-treino">Começar o treino</button>
    <nav class="barra" aria-label="Seções"><button type="button" aria-current="page"><i data-icone="dumbbell"></i>Treino</button><button type="button"><i data-icone="calendar-days"></i>Semana</button><button type="button"><i data-icone="user"></i>Meus dados</button></nav>
  </footer>
</section>

<!-- ===== TREINO ===== -->
<section class="tela tela-treino" aria-label="Treino">
  <header class="treino-topo gutter">
    <button type="button" class="volta" data-acao="ir-inicio" aria-label="Voltar ao início"><i data-icone="chevron-left"></i></button>
    <p><span data-t="posicao"></span></p>
    <button type="button" class="senti"><i data-icone="triangle-alert"></i>Senti algo</button>
  </header>

  <div class="palco-bloco na-serie">
    <div class="moldura"><div class="palco" data-palco role="img" aria-label="O Boneco fazendo o exercício"></div><p class="fase" data-fase-do-movimento></p></div>
    <div class="palco-ctl gutter">
      <div class="seg" role="group" aria-label="O que o guia mostra"><button type="button" data-acao="modo" data-v="tec">Técnica</button><button type="button" data-acao="modo" data-v="mus">Músculos</button></div>
      <button type="button" class="redondo" data-acao="pausar" aria-label="Pausar ou tocar o guia"><i data-icone="pause" data-pausa-icone></i></button>
    </div>
  </div>

  <div class="relogio-bloco gutter" data-progresso>
    <p class="rotulo">Descanso</p>
    <p class="relogio" role="timer" data-t="relogio"></p>
    <div class="trilho" aria-hidden="true"><i></i></div>
    <div class="tres"><button type="button" class="btn quieto" data-acao="menos15">−15 s</button><button type="button" class="btn quieto" data-acao="mais15">+15 s</button><button type="button" class="btn quieto" data-acao="pular">Pular</button></div>
  </div>

  <div class="ex gutter">
    <span class="palco mini" data-mini="bulgaro"></span>
    <div class="txt">
      <h1 data-t="exNome"></h1>
      <p class="apoio"><span data-t="prescricao"></span> · descanso <span data-t="descanso"></span></p>
    </div>
    <button type="button" class="redondo" aria-label="Mais opções"><i data-icone="ellipsis"></i></button>
  </div>

  <section class="painel gutter" aria-label="Registrar a série">
    <p class="hora">Hora da próxima série</p>
    <div class="painel-cab">
      <h2>Série <span data-t="serie"></span> de <span data-t="series"></span></h2>
      <p class="salva"><i data-icone="check"></i><span data-t="ultima"></span><button type="button" data-acao="desfazer">Desfazer</button></p>
    </div>
    <div class="dupla">
      <div class="passo"><span class="rotulo">Carga</span><div class="passo-linha"><button type="button" data-acao="carga-menos" aria-label="Menos carga"><i data-icone="minus"></i></button><output><span data-t="carga"></span><small>kg</small></output><button type="button" data-acao="carga-mais" aria-label="Mais carga"><i data-icone="plus"></i></button></div></div>
      <div class="passo"><span class="rotulo">Repetições</span><div class="passo-linha"><button type="button" data-acao="reps-menos" aria-label="Menos uma repetição"><i data-icone="minus"></i></button><output data-t="reps"></output><button type="button" data-acao="reps-mais" aria-label="Mais uma repetição"><i data-icone="plus"></i></button></div></div>
    </div>
    <div class="rir">
      <div class="rir-cab"><span class="rotulo">Quantas ainda conseguiria?</span><span class="apoio">meta de hoje: <span data-t="metaRir"></span></span></div>
      <div class="rir-linha" role="group" aria-label="Quantas ainda conseguiria? (RIR)"><button type="button" data-acao="rir" data-v="0" data-meta-rir>0</button><button type="button" data-acao="rir" data-v="1" data-meta-rir>1</button><button type="button" data-acao="rir" data-v="2" data-meta-rir>2</button><button type="button" data-acao="rir" data-v="3" data-meta-rir>3</button><button type="button" data-acao="rir" data-v="4" data-meta-rir aria-label="4 ou mais">4+</button></div>
    </div>
    <button type="button" class="btn pri" data-acao="feita">Série feita <span class="sub">· descansar <span data-t="descanso"></span></span></button>
  </section>
</section>

</div>
<script src="../comum/dados.js"></script>
<script src="../comum/boneco.js"></script>
<script src="../comum/icones.js"></script>
<script src="../comum/proto.js"></script>
</body>
</html>
