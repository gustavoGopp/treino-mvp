<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direção B, Placar</title>
<link rel="stylesheet" href="../comum/boneco.css">
<link rel="stylesheet" href="../comum/base.css">
<style>
/* Direção B, "Placar": a interface é preta e branca e a única cor na tela é a do Boneco. Os números são o maior
   elemento (carga e repetições em 72, relógio em 128, para ler com o celular no chão); a lista do dia é uma tabela. */
@font-face{font-family:"Geist";font-weight:100 900;font-display:swap;src:url("../comum/fontes/geist-latin.woff2") format("woff2")}
:root{
  --fonte:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fundo:#F6F6F4; --sup:#FFFFFF; --sup2:#E9E9E6; --linha:#D8D8D4; --texto:#0E0E10; --texto2:#55565A;
  --acao:#0E0E10; --sobre-acao:#FFFFFF; --foco:#0E0E10;
  --alerta:#A8243A; --alerta-suave:#FBE4E6; --feito:#0F6B3E; --inativo:#8F9094;
  --r8:8px;
  --t-relogio:8rem; --t-numero:4.5rem; --t-titulo:2.5rem; --t-ex:1.25rem; --t-corpo:1.0625rem; --t-apoio:.9375rem; --t-rotulo:.8125rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fundo:#0B0B0C; --sup:#161618; --sup2:#232326; --linha:#2E2E32; --texto:#F4F4F2; --texto2:#A6A7AB;
  --acao:#F4F4F2; --sobre-acao:#0B0B0C; --foco:#F4F4F2;
  --alerta:#F0888F; --alerta-suave:#3A1A1E; --feito:#65AE80; --inativo:#6E6F74; color-scheme:dark}}
:root[data-theme="dark"]{
  --fundo:#0B0B0C; --sup:#161618; --sup2:#232326; --linha:#2E2E32; --texto:#F4F4F2; --texto2:#A6A7AB;
  --acao:#F4F4F2; --sobre-acao:#0B0B0C; --foco:#F4F4F2;
  --alerta:#F0888F; --alerta-suave:#3A1A1E; --feito:#65AE80; --inativo:#6E6F74; color-scheme:dark}
body{font-size:var(--t-corpo)}
.rotulo{font-size:var(--t-rotulo);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto2)}
.apoio{font-size:var(--t-apoio);color:var(--texto2)}
.gutter{padding-left:max(var(--e16),env(safe-area-inset-left,0px));padding-right:max(var(--e16),env(safe-area-inset-right,0px))}
.btn{min-height:var(--h56);padding:0 var(--e16);border-radius:var(--r8);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--e8);transition:transform .1s ease-out}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acao);color:var(--sobre-acao);min-height:var(--h64);width:100%;font-size:1.1875rem}
.btn.pri:disabled{background:var(--sup2);color:var(--inativo);transform:none}
.btn.pri .sub{font-weight:400;font-size:var(--t-apoio);opacity:.8}
.btn.quieto{background:var(--sup2)}

/* ---------- início ---------- */
.tela-inicio .miolo{flex:1;display:flex;flex-direction:column;gap:var(--e32);padding-top:var(--e32);padding-bottom:var(--e24)}
.hoje{display:flex;flex-direction:column;gap:var(--e16)}
.hoje h1{font-size:var(--t-titulo);font-weight:700;line-height:1;letter-spacing:-.03em}
.tres-num{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--e16)}
.tres-num div{display:flex;flex-direction:column;gap:var(--e4)}
.tres-num b{font-size:2rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.tabela li,.tabela button{display:grid;grid-template-columns:var(--e24) 1fr auto;align-items:center;gap:var(--e8);min-height:var(--h56);border-top:1px solid var(--linha);width:100%;text-align:left;padding:var(--e8) 0}
.tabela .n{color:var(--texto2);font-size:var(--t-apoio)}
.tabela .nome{font-weight:500;line-height:1.25;min-width:0}
.tabela .rx{font-size:var(--t-apoio);color:var(--texto2);white-space:nowrap}
.secao{display:flex;flex-direction:column;gap:var(--e8)}
.base{position:sticky;bottom:0;background:var(--fundo);padding-top:var(--e16);display:flex;flex-direction:column;gap:var(--e8);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra{display:flex}
.barra button{flex:1;min-height:var(--h64);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--e4);font-size:var(--t-rotulo);font-weight:600;color:var(--texto2)}
.barra button[aria-current]{color:var(--texto)}
.barra [data-icone]{--icone:24px}

/* ---------- treino ---------- */
.treino-topo{display:flex;align-items:center;gap:var(--e16);min-height:var(--h64);padding-top:var(--e8);padding-bottom:var(--e8)}
.treino-topo .volta{width:var(--h48);height:var(--h48);display:grid;place-items:center;border-radius:var(--r8);margin-left:calc(-1 * var(--e8));margin-right:calc(-1 * var(--e8))}
.treino-topo .pos{flex:1;font-weight:600}
.senti{min-height:var(--h48);padding:0 var(--e16);border-radius:var(--r8);background:var(--alerta-suave);color:var(--alerta);font-weight:600;display:inline-flex;align-items:center;gap:var(--e8)}
.senti [data-icone]{--icone:20px}
.moldura{position:relative}
.moldura .palco{aspect-ratio:16/9;width:100%}
.moldura .fase{position:absolute;top:var(--e8);left:max(var(--e16),env(safe-area-inset-left,0px));font-size:var(--t-rotulo);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto2)}
.ctl{display:flex;justify-content:space-between;gap:var(--e8);padding-top:var(--e8)}
.ctl > div{display:flex;gap:var(--e8)}
.ctl button{min-height:var(--h48);min-width:var(--h48);padding:0 var(--e16);border-radius:var(--r8);background:var(--sup2);font-size:var(--t-apoio);font-weight:600;display:inline-grid;place-items:center}
.ctl button[aria-pressed="true"]{background:var(--acao);color:var(--sobre-acao)}
.ctl [data-icone]{--icone:20px}
.ex{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e16);padding-top:var(--e16)}
.ex h1{font-size:var(--t-ex);font-weight:600;line-height:1.2;letter-spacing:-.01em}
.ex .txt{display:flex;flex-direction:column;gap:var(--e4);min-width:0}
.pips{display:flex;gap:var(--e4);padding-top:var(--e8);flex:none}
.pips li{width:var(--e16);height:var(--e8);border-radius:var(--r8);background:var(--sup2)}
.pips li[data-feita]{background:var(--texto)}
.pips li[data-atual]{outline:2px solid var(--texto);outline-offset:-2px}
.corpo-treino{flex:1;display:flex;flex-direction:column;gap:var(--e24);padding-bottom:calc(var(--e16) + env(safe-area-inset-bottom,0px))}
.placar{display:grid;grid-template-columns:1fr 1fr;gap:var(--e16)}
.placar > div{display:flex;flex-direction:column;gap:var(--e8)}
.placar output{font-size:var(--t-numero);font-weight:700;line-height:1;letter-spacing:-.04em;display:block}
.placar output small{font-size:var(--t-ex);font-weight:500;letter-spacing:0;color:var(--texto2);margin-left:var(--e4)}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:var(--e8)}
.mm button{min-height:var(--h56);border-radius:var(--r8);background:var(--sup2);display:grid;place-items:center;transition:transform .1s ease-out}
.mm button:active{transform:scale(.96)}
.mm button:disabled{color:var(--inativo)}
.rir{display:flex;flex-direction:column;gap:var(--e8)}
.rir-cab{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e8);flex-wrap:wrap}
.rir-linha{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--e8)}
.rir-linha button{min-height:var(--h48);border-radius:var(--r8);background:var(--sup2);font-weight:600;position:relative}
.rir-linha button[data-na-meta]::after{content:"";position:absolute;left:var(--e16);right:var(--e16);bottom:var(--e8);height:2px;background:currentColor;opacity:.5}
.rir-linha button[aria-pressed="true"]{background:var(--acao);color:var(--sobre-acao)}
.fim{margin-top:auto;display:flex;flex-direction:column;gap:var(--e8)}
.hora{display:none;font-size:var(--t-ex);font-weight:700}
body[data-acabou] .hora{display:block}
/* o descanso toma a tela: o relógio é o maior elemento, para ler de longe */
.descanso{flex:1;display:none;flex-direction:column;gap:var(--e24);padding-top:var(--e16);padding-bottom:calc(var(--e16) + env(safe-area-inset-bottom,0px))}
body[data-fase="descanso"] .descanso{display:flex}
body[data-fase="descanso"] .so-serie{display:none}
.relogio-area{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--e16)}
.relogio{font-size:var(--t-relogio);font-weight:700;line-height:.9;letter-spacing:-.05em}
.trilho{height:var(--e4);background:var(--sup2);overflow:hidden}
.trilho i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:var(--texto);transition:width 1s linear}
.aseguir{display:flex;align-items:center;gap:var(--e16)}
.aseguir .mini{width:5rem;aspect-ratio:4/3;border-radius:var(--r8);flex:none}
.aseguir .txt{display:flex;flex-direction:column;gap:var(--e4);min-width:0}
.aseguir b{font-weight:600;line-height:1.25}
.salva{display:flex;align-items:center;justify-content:space-between;gap:var(--e8);font-size:var(--t-apoio);color:var(--texto2);border-top:1px solid var(--linha);padding-top:var(--e8)}
.salva span{display:inline-flex;align-items:center;gap:var(--e8)}
.salva [data-icone]{--icone:20px;color:var(--feito)}
.salva button{min-height:var(--h48);padding:0 var(--e8);margin-right:calc(-1 * var(--e8));text-decoration:underline;text-underline-offset:4px;font-weight:600;color:var(--texto)}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:var(--e8)}
@media (max-width:359px){:root{--t-relogio:6.5rem;--t-numero:3.5rem;--t-titulo:2rem}}
@media (max-height:700px){.moldura .palco{aspect-ratio:2/1}.corpo-treino{gap:var(--e16)}}
</style>
</head>
<body data-tela="inicio" data-fase="serie">
<nav class="proto" aria-label="Protótipo"><b>B · Placar</b><a href="../index.html">Direções</a><button type="button" data-acao="ir-inicio">Início</button><button type="button" data-acao="ir-treino">Treino</button><button type="button" data-acao="tema" aria-label="Trocar o tema"><i data-icone="sun-moon"></i></button></nav>
<div class="celular">

<!-- ===== INÍCIO ===== -->
<section class="tela tela-inicio" aria-label="Início">
  <main class="miolo gutter">
    <div class="hoje">
      <p class="rotulo">Hoje · semana <span data-t="semana"></span></p>
      <h1 data-t="diaNome"></h1>
      <div class="tres-num">
        <div><b data-t="nExercicios"></b><span class="rotulo">exercícios</span></div>
        <div><b>~<span data-t="minutos"></span></b><span class="rotulo">minutos</span></div>
        <div><b>0/<span data-t="diasPorSemana"></span></b><span class="rotulo">na semana</span></div>
      </div>
    </div>
    <ol class="tabela" data-lista="exercicios" aria-label="Exercícios de hoje"><template><li><span class="n" data-i="n"></span><span class="nome" data-i="nome"></span><span class="rx" data-i="prescricao"></span></li></template></ol>
    <div class="secao">
      <h2 class="rotulo">Outros dias</h2>
      <div class="tabela" data-lista="outros-dias"><template><button type="button"><span></span><span class="nome" data-i="nome"></span><span class="rx" data-i="resumo"></span></button></template></div>
    </div>
  </main>
  <footer class="base gutter">
    <button type="button" class="btn pri" data-acao="ir-treino">Começar o treino</button>
    <nav class="barra" aria-label="Seções"><button type="button" aria-current="page"><i data-icone="dumbbell"></i>Treino</button><button type="button"><i data-icone="calendar-days"></i>Semana</button><button type="button"><i data-icone="user"></i>Meus dados</button></nav>
  </footer>
</section>

<!-- ===== TREINO ===== -->
<section class="tela tela-treino" aria-label="Treino">
  <header class="treino-topo gutter">
    <button type="button" class="volta" data-acao="ir-inicio" aria-label="Voltar ao início"><i data-icone="chevron-left"></i></button>
    <p class="pos"><span data-t="posicao"></span></p>
    <button type="button" class="senti"><i data-icone="triangle-alert"></i>Senti algo</button>
  </header>

  <div class="moldura so-serie">
    <div class="palco" data-palco role="img" aria-label="O Boneco fazendo o exercício"></div>
    <p class="fase" data-fase-do-movimento></p>
  </div>
  <div class="ctl gutter so-serie"><div role="group" aria-label="O que o guia mostra"><button type="button" data-acao="modo" data-v="tec">Técnica</button><button type="button" data-acao="modo" data-v="mus">Músculos</button></div><button type="button" data-acao="pausar" aria-label="Pausar ou tocar o guia"><i data-icone="pause" data-pausa-icone></i></button></div>

  <div class="corpo-treino gutter so-serie">
    <div class="ex">
      <div class="txt"><h1 data-t="exNome"></h1><p class="apoio"><span data-t="prescricao"></span> · descanso <span data-t="descanso"></span></p></div>
      <ol class="pips" data-lista="series" aria-label="Séries"><template><li></li></template></ol>
    </div>
    <p class="hora">Hora da próxima série</p>
    <div class="placar">
      <div><span class="rotulo">Carga</span><output><span data-t="carga"></span><small>kg</small></output><div class="mm"><button type="button" data-acao="carga-menos" aria-label="Menos carga"><i data-icone="minus"></i></button><button type="button" data-acao="carga-mais" aria-label="Mais carga"><i data-icone="plus"></i></button></div></div>
      <div><span class="rotulo">Repetições</span><output data-t="reps"></output><div class="mm"><button type="button" data-acao="reps-menos" aria-label="Menos uma repetição"><i data-icone="minus"></i></button><button type="button" data-acao="reps-mais" aria-label="Mais uma repetição"><i data-icone="plus"></i></button></div></div>
    </div>
    <div class="rir">
      <div class="rir-cab"><span class="rotulo">Quantas ainda conseguiria?</span><span class="apoio">meta de hoje: <span data-t="metaRir"></span></span></div>
      <div class="rir-linha" role="group" aria-label="Quantas ainda conseguiria? (RIR)"><button type="button" data-acao="rir" data-v="0" data-meta-rir>0</button><button type="button" data-acao="rir" data-v="1" data-meta-rir>1</button><button type="button" data-acao="rir" data-v="2" data-meta-rir>2</button><button type="button" data-acao="rir" data-v="3" data-meta-rir>3</button><button type="button" data-acao="rir" data-v="4" data-meta-rir aria-label="4 ou mais">4+</button></div>
    </div>
    <div class="fim"><button type="button" class="btn pri" data-acao="feita">Série feita <span class="sub">· descansar <span data-t="descanso"></span></span></button></div>
  </div>

  <div class="descanso gutter" data-progresso>
    <div class="relogio-area">
      <p class="rotulo">Descanso</p>
      <p class="relogio" role="timer" data-t="relogio"></p>
      <div class="trilho" aria-hidden="true"><i></i></div>
    </div>
    <div class="aseguir">
      <span class="palco mini" data-mini="bulgaro"></span>
      <div class="txt"><span class="rotulo">A seguir · série <span data-t="serie"></span> de <span data-t="series"></span></span><b data-t="exNome"></b><span class="apoio"><span data-t="carga"></span> kg × <span data-t="reps"></span></span></div>
    </div>
    <p class="salva"><span><i data-icone="check"></i><span><span data-t="serieSalva"></span> · <span data-t="ultima"></span></span></span><button type="button" data-acao="desfazer">Desfazer</button></p>
    <div class="dois"><button type="button" class="btn quieto" data-acao="menos15">−15 s</button><button type="button" class="btn quieto" data-acao="mais15">+15 s</button></div>
    <button type="button" class="btn pri" data-acao="pular">Começar a série <span data-t="serie"></span></button>
  </div>
</section>

</div>
<script src="../comum/dados.js"></script>
<script src="../comum/boneco.js"></script>
<script src="../comum/icones.js"></script>
<script src="../comum/proto.js"></script>
</body>
</html>
