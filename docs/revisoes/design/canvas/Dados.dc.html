body{margin:0}

.app{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;overflow:hidden}

.linha:last-child{border-bottom:0}
.linha span{flex:1;display:flex;flex-direction:column}
.linha small{color:var(--ink2);font-size:14px}
.rot{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--ink2);padding:0 4px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:4px 8px 12px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;border-radius:12px}
.nav a.on{color:var(--acc)}
</style>
